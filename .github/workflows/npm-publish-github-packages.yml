# Publish dsh-jira-tasks to the public npm registry and to GitHub Packages
# when a release is created (or manually dispatched).
# The package IS the repository root (package.json + cordis.patch.yml + lib/),
# so that `dsh plugin add github:liu3734/jira-tasks-dsh-plugin` installs it.
# Requires the repository secret NPM_TOKEN (an npmjs.org access token).

name: Publish npm package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - name: Publish to npmjs.org
        run: |
          # 幂等：不要靠错误文案判断成败。同一个版本可能因为“本地已发过一次”、
          # 重跑、或并发 publish 而返回 403 "cannot publish over previously
          # published versions" / 409 "Cannot publish over previously staged
          # version"（v1.1.0 发版时就撞上最后这种，导致后面 GitHub Packages 那步
          # 被跳过）。这里以注册表里版本是否可见为唯一判据，并给它一点同步时间。
          npm publish 2>/tmp/npmjs-publish.log || true
          VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-jira-tasks@${VERSION}" version >/dev/null 2>&1; then
              echo "npmjs.org: dsh-jira-tasks@${VERSION} is published"
              exit 0
            fi
            echo "npmjs.org: ${VERSION} not visible yet (attempt ${attempt}/6), retrying"
            sleep 10
          done
          echo "npmjs.org: dsh-jira-tasks@${VERSION} never became visible"
          cat /tmp/npmjs-publish.log
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to GitHub Packages
        run: |
          # GitHub npm 仓库只接受 @owner/name 作用域包名（无作用域会 404），
          # 这里仅为此仓库改名，不影响 npmjs.org 上的 dsh-jira-tasks
          npm pkg set name=@liu3734/dsh-jira-tasks
          npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"
          npm publish --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
