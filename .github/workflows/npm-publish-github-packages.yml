# Publish dsh-jira-tasks to the public npm registry and to GitHub Packages
# when a release is created (or manually dispatched).
# The package lives in profile-package/, so all steps run there.
# Requires the repository secret NPM_TOKEN (an npmjs.org access token).

name: Publish npm package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profile-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profile-package
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - name: Publish to npmjs.org
        run: |
          npm publish 2>/tmp/npmjs-publish.log || {
            # 幂等：版本已发布（手动重跑时）视为成功
            grep -qE "You cannot publish over the previously published versions|EPUBLISHCONFLICT" /tmp/npmjs-publish.log && {
              echo "npmjs.org: version already exists, skip publish"
              exit 0
            }
            cat /tmp/npmjs-publish.log
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to GitHub Packages
        run: |
          # GitHub npm 仓库只接受 @owner/name 作用域包名（无作用域会 404），
          # 这里仅为此仓库改名，不影响 npmjs.org 上的 dsh-jira-tasks
          npm pkg set name=@liu3734/dsh-jira-tasks
          npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"
          npm publish --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
